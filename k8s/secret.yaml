# JWT Secret for iCondo
# ⚠️ CHANGE THIS before applying to production!
# Generate a strong secret:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#
# Apply with:
#   kubectl create secret generic icondo-secret -n icondo \
#     --from-literal=jwt-secret='your-strong-secret-here' \
#     --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: icondo-secret
  namespace: icondo
type: Opaque
stringData:
  jwt-secret: "change-me-to-a-random-64-char-hex-string"
