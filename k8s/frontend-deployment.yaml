apiVersion: apps/v1
kind: Deployment
metadata:
  name: icondo-frontend
  namespace: icondo
  labels:
    app: icondo
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: icondo
      tier: frontend
  template:
    metadata:
      labels:
        app: icondo
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: icondo-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
